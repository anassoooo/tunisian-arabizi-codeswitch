name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the unit tests only touch data cleaning and metrics, so torch/transformers are not needed
      - run: pip install numpy
      - run: python -m unittest discover -s tests -v
